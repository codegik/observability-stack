server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://loan-backend:8080;
    proxy_set_header Host $host;
  }

  location /v1/traces {
    proxy_pass http://${OTEL_COLLECTOR_HOST}:4318/v1/traces;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
